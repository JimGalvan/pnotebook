[package]
name = "notebook"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
chromiumoxide = "0.9.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
futures = "0.3.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
