<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Notebook</title>
<style>
  :root { --bg: #1e1f22; --bar: #2b2d31; --tab: #383a40; --fg: #e6e6e6; --muted: #9aa0a6; --accent: #5b9cf6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #tabs { display: flex; gap: 2px; padding: 6px 6px 0; overflow-x: auto; scrollbar-width: none; }
  .tab { display: flex; align-items: center; gap: 6px; width: 200px; min-width: 90px; flex-shrink: 1; padding: 7px 10px; background: var(--bar); color: var(--muted); border-radius: 8px 8px 0 0; cursor: pointer; }
  .tab.on { background: var(--tab); color: var(--fg); }
  .tab span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .x { opacity: .5; border-radius: 4px; padding: 0 3px; }
  .x:hover { opacity: 1; background: #ffffff1a; }
  #bar { display: flex; gap: 4px; padding: 6px; background: var(--tab); align-items: center; }
  button { background: none; border: 0; color: var(--fg); font-size: 15px; line-height: 1; padding: 6px 9px; border-radius: 6px; cursor: pointer; }
  button:hover { background: #ffffff1a; }
  #url { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid transparent; border-radius: 16px; padding: 7px 14px; font-size: 13px; outline: none; }
  #url:focus { border-color: var(--accent); }
  #bm { display: flex; gap: 4px; padding: 0 6px 6px; background: var(--tab); overflow-x: auto; scrollbar-width: none; }
  #bm:empty { display: none; }
  .bm { display: flex; align-items: center; gap: 4px; max-width: 180px; padding: 3px 8px; border-radius: 10px; background: var(--bar); cursor: pointer; white-space: nowrap; }
  .bm span { overflow: hidden; text-overflow: ellipsis; }
  .bm .x { display: none; }
  .bm:hover .x { display: inline; }
  .bm-edit { width: 150px; background: var(--bg); color: var(--fg); border: 1px solid var(--accent); border-radius: 6px; padding: 0 4px; font: inherit; outline: none; }
  #view { flex: 1; position: relative; overflow: hidden; background: #fff; }
  canvas { position: absolute; top: 0; left: 0; outline: none; cursor: default; touch-action: none; }
  #zoom { font-size: 12px; min-width: 46px; padding: 6px 4px; color: var(--muted); }
  @media (hover: none) { .bm .x { display: inline; } }
  @media (max-width: 600px) { #fwd { display: none; } .tab { width: 140px; } }
  #msg { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; background: var(--bg); color: var(--muted); font-size: 15px; }
  #msg button { background: var(--accent); color: #fff; font-size: 14px; padding: 8px 14px; }
</style>
</head>
<body>
<div id="app">
  <div id="tabs"></div>
  <div id="bar">
    <button id="back" title="Back">&#9664;</button>
    <button id="fwd" title="Forward">&#9654;</button>
    <button id="reload" title="Reload">&#10227;</button>
    <input id="url" autocomplete="off" spellcheck="false" placeholder="Search or enter address">
    <button id="zoomOut" title="Zoom out (Ctrl -)">&minus;</button>
    <button id="zoom" title="Reset zoom (Ctrl 0)">100%</button>
    <button id="zoomIn" title="Zoom in (Ctrl +)">+</button>
    <button id="star" title="Bookmark this page">&#9734;</button>
    <form method="post" action="/logout" style="margin:0"><button title="Log out">&#9211;</button></form>
  </div>
  <div id="bm"></div>
  <div id="view">
    <canvas id="screen" tabindex="0"></canvas>
    <div id="msg">Connecting…</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const canvas = $('screen'), ctx = canvas.getContext('2d'), view = $('view'), msg = $('msg'), url = $('url');
let ws, state = { tabs: [], bookmarks: [] }, replaced = false, failed = null;
let selected = '';   // text selected in the remote page, kept ready for Ctrl+C
let editing = null;  // url of the bookmark being renamed
const ZOOMS = [50, 67, 75, 80, 90, 100, 110, 125, 150, 175, 200];
let zoom = 100;
try { zoom = ZOOMS.includes(+localStorage.getItem('zoom')) ? +localStorage.getItem('zoom') : 100; } catch {}

const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function status(text) {
  msg.style.display = text ? 'flex' : 'none';
  msg.textContent = text || '';
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { resize(); };
  ws.onmessage = e => {
    if (typeof e.data !== 'string') return frame(e.data);
    const m = JSON.parse(e.data);
    if (m.t === 'state') { state = m; render(); }
    else if (m.t === 'sel') selected = m.text;
    else if (m.t === 'status') status(m.msg);
    else if (m.t === 'error') failed = m.msg;
    else if (m.t === 'replaced') {
      replaced = true;
      status('This session is open in another window.');
      const b = el('button', null, 'Use it here');
      b.onclick = () => location.reload();
      msg.append(b);
    }
  };
  ws.onclose = () => {
    if (replaced) return;
    if (failed) {
      status('Could not start: ' + failed);
      const b = el('button', null, 'Retry');
      b.onclick = () => location.reload();
      msg.append(b);
      return;
    }
    status('Disconnected. Reconnecting…');
    setTimeout(() => location.reload(), 2000);
  };
}

// Frames: decode off the main thread, always draw the newest one.
let pending = null, drawing = false;
function frame(buf) { pending = buf; if (!drawing) draw(); }
async function draw() {
  drawing = true;
  while (pending) {
    const buf = pending; pending = null;
    try {
      const bmp = await createImageBitmap(new Blob([buf], { type: 'image/jpeg' }));
      // Below 100% zoom Chrome sends frames larger than the canvas; scale to fit.
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      bmp.close();
      if (msg.style.display !== 'none') status('');
    } catch {}
  }
  drawing = false;
}

let resizeTimer;
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  send({ t: 'size', w, h, zoom: zoom / 100 });
}

function setZoom(z) {
  zoom = z;
  try { localStorage.setItem('zoom', z); } catch {}
  $('zoom').textContent = z + '%';
  resize();
}
function stepZoom(dir) {
  const i = ZOOMS.indexOf(zoom);
  setZoom(ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, i + dir))]);
}
$('zoomOut').onclick = () => stepZoom(-1);
$('zoomIn').onclick = () => stepZoom(1);
$('zoom').onclick = () => setZoom(100);
$('zoom').textContent = zoom + '%';
new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); }).observe(view);

// Mouse. On a Mac, Cmd is sent as Ctrl since the remote Chrome runs on Linux.
const MAC = /Mac|iPhone|iPad/.test(navigator.platform);
const mods = e => (e.getModifierState && e.getModifierState('AltGraph')) ? 0 :
  (e.altKey ? 1 : 0) | (e.ctrlKey || (MAC && e.metaKey) ? 2 : 0) | (!MAC && e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0);
const BUTTONS = ['left', 'middle', 'right', 'back', 'forward'];
const held = b => b & 1 ? 'left' : b & 4 ? 'middle' : b & 2 ? 'right' : 'none';
function pos(e) {
  const r = canvas.getBoundingClientRect(), z = zoom / 100;
  return { x: (e.clientX - r.left) / z, y: (e.clientY - r.top) / z };
}
function mouse(type, e, extra) {
  send({ t: 'mouse', p: { type, ...pos(e), modifiers: mods(e), buttons: e.buttons, ...extra } });
}
let pressed = false;
canvas.addEventListener('mousedown', e => {
  e.preventDefault(); canvas.focus(); pressed = true;
  mouse('mousePressed', e, { button: BUTTONS[e.button] || 'none', clickCount: e.detail || 1 });
});
window.addEventListener('mouseup', e => {
  if (!pressed) return; pressed = false;
  mouse('mouseReleased', e, { button: BUTTONS[e.button] || 'none', clickCount: e.detail || 1 });
});
let lastMove = null;
window.addEventListener('mousemove', e => {
  if (e.target !== canvas && !pressed) return;
  if (!lastMove) requestAnimationFrame(() => { mouse('mouseMoved', lastMove, { button: held(lastMove.buttons) }); lastMove = null; });
  lastMove = e;
});
// Scrolling is batched to one wheel event per frame. Deltas are in screen
// pixels and get converted to page pixels for the current zoom.
let wheel = null;
function queueWheel(e, dx, dy) {
  if (!wheel) {
    wheel = { e, dx: 0, dy: 0 };
    requestAnimationFrame(() => {
      const z = zoom / 100;
      mouse('mouseWheel', wheel.e, { deltaX: wheel.dx / z, deltaY: wheel.dy / z });
      wheel = null;
    });
  }
  wheel.e = e; wheel.dx += dx; wheel.dy += dy;
}
let pinch = 0;
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey) {  // Ctrl+wheel and trackpad pinch zoom the page
    pinch += e.deltaY;
    if (Math.abs(pinch) >= 40) { stepZoom(pinch < 0 ? 1 : -1); pinch = 0; }
    return;
  }
  const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? canvas.height : 1;
  queueWheel(e, e.deltaX * k, e.deltaY * k);
}, { passive: false });

// Touch: a one-finger drag scrolls (with momentum when flicked), a tap clicks.
let touch = null, fling = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  cancelAnimationFrame(fling);
  const t = e.touches[0];
  touch = e.touches.length === 1
    ? { x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY, last: e.timeStamp, vx: 0, vy: 0, moved: false }
    : null;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touch || e.touches.length !== 1) return;
  const t = e.touches[0];
  if (!touch.moved && Math.hypot(t.clientX - touch.x0, t.clientY - touch.y0) < 8) return;
  touch.moved = true;
  const dx = touch.x - t.clientX, dy = touch.y - t.clientY;
  const dt = Math.max(1, e.timeStamp - touch.last);
  touch.vx = dx / dt; touch.vy = dy / dt;
  touch.x = t.clientX; touch.y = t.clientY; touch.last = e.timeStamp;
  queueWheel(t, dx, dy);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!touch) return;
  const t = e.changedTouches[0];
  if (!touch.moved) {
    canvas.focus();
    mouse('mouseMoved', t, { button: 'none' });
    mouse('mousePressed', t, { button: 'left', buttons: 1, clickCount: 1 });
    mouse('mouseReleased', t, { button: 'left', buttons: 0, clickCount: 1 });
  } else if (e.timeStamp - touch.last < 80) {
    flingScroll(t, touch.vx, touch.vy);
  }
  touch = null;
}, { passive: false });
function flingScroll(t, vx, vy) {
  const point = { clientX: t.clientX, clientY: t.clientY };
  let last = performance.now();
  const step = now => {
    const dt = now - last; last = now;
    const decay = Math.pow(0.996, dt);
    vx *= decay; vy *= decay;
    if (Math.abs(vx) < 0.02 && Math.abs(vy) < 0.02) return;
    queueWheel(point, vx * dt, vy * dt);
    fling = requestAnimationFrame(step);
  };
  fling = requestAnimationFrame(step);
}
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Keyboard. Ctrl+C/X also put the remote selection on the local clipboard,
// and Ctrl+V is left to the local browser so the paste event below can send
// the local clipboard text.
function key(e, down) {
  if (e.key === 'Dead' || e.isComposing) return;
  const altGr = e.getModifierState && e.getModifierState('AltGraph');
  const plain = altGr || (!e.ctrlKey && !e.metaKey && !e.altKey);
  let text = '';
  if (down && plain) text = e.key.length === 1 ? e.key : e.key === 'Enter' ? '\r' : '';
  send({ t: 'key', p: {
    type: down ? (text ? 'keyDown' : 'rawKeyDown') : 'keyUp',
    modifiers: mods(e), key: e.key, code: e.code,
    windowsVirtualKeyCode: e.keyCode, nativeVirtualKeyCode: e.keyCode,
    text: text || undefined, unmodifiedText: text || undefined,
    autoRepeat: e.repeat, location: e.location,
  } });
}
const shortcut = (e, k) => (e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === k;
canvas.addEventListener('keydown', e => {
  if (shortcut(e, 'v')) return;
  e.preventDefault();
  if (shortcut(e, '=') || shortcut(e, '+')) return stepZoom(1);
  if (shortcut(e, '-')) return stepZoom(-1);
  if (shortcut(e, '0')) return setZoom(100);
  if ((shortcut(e, 'c') || shortcut(e, 'x')) && selected) navigator.clipboard.writeText(selected).catch(() => {});
  key(e, true);
});
canvas.addEventListener('keyup', e => { e.preventDefault(); key(e, false); });
document.addEventListener('paste', e => {
  if (document.activeElement !== canvas) return;
  e.preventDefault();
  const text = e.clipboardData.getData('text');
  if (text) send({ t: 'text', text });
});

// Toolbar
$('back').onclick = () => send({ t: 'back' });
$('fwd').onclick = () => send({ t: 'forward' });
$('reload').onclick = () => send({ t: 'reload' });
url.addEventListener('keydown', e => {
  if (e.key === 'Enter' && url.value.trim()) { send({ t: 'go', url: url.value }); canvas.focus(); }
  if (e.key === 'Escape') { canvas.focus(); render(); }
});
url.addEventListener('focus', () => url.select());
const activeTab = () => state.tabs.find(t => t.id === state.active);
$('star').onclick = () => {
  const tab = activeTab();
  if (!tab) return;
  if (state.bookmarks.some(b => b.url === tab.url)) send({ t: 'bm_del', url: tab.url });
  else send({ t: 'bm_add' });
};

function render() {
  const tabs = $('tabs');
  tabs.replaceChildren();
  for (const t of state.tabs) {
    const d = el('div', 'tab' + (t.id === state.active ? ' on' : ''));
    d.title = t.url;
    const close = el('span', 'x', '✕');
    close.style.flex = 'none';
    close.onclick = ev => { ev.stopPropagation(); send({ t: 'tab_close', id: t.id }); };
    d.onclick = () => send({ t: 'tab_select', id: t.id });
    d.append(el('span', null, t.title || (t.url === 'about:blank' ? 'New tab' : t.url)), close);
    tabs.append(d);
  }
  const plus = el('button', null, '+');
  plus.title = 'New tab';
  plus.onclick = () => { send({ t: 'tab_new' }); url.focus(); };
  tabs.append(plus);

  const tab = activeTab();
  if (tab && document.activeElement !== url) url.value = tab.url === 'about:blank' ? '' : tab.url;
  const starred = tab && state.bookmarks.some(b => b.url === tab.url);
  $('star').innerHTML = starred ? '&#9733;' : '&#9734;';

  if (editing) return;
  const bm = $('bm');
  bm.replaceChildren();
  for (const b of state.bookmarks) {
    const d = el('div', 'bm');
    d.title = b.url;
    const edit = el('span', 'x', '✎');
    edit.title = 'Rename';
    edit.onclick = ev => { ev.stopPropagation(); rename(d, b); };
    const del = el('span', 'x', '✕');
    del.title = 'Remove';
    del.onclick = ev => { ev.stopPropagation(); send({ t: 'bm_del', url: b.url }); };
    d.onclick = () => { send({ t: 'go', url: b.url }); canvas.focus(); };
    d.append(el('span', null, b.title), edit, del);
    bm.append(d);
  }
}

function rename(d, b) {
  editing = b.url;
  const input = el('input', 'bm-edit');
  input.value = b.title;
  d.onclick = null;
  d.replaceChildren(input);
  input.focus();
  input.select();
  const done = save => {
    if (!editing) return;
    editing = null;
    const title = input.value.trim();
    if (save && title && title !== b.title) send({ t: 'bm_rename', url: b.url, title });
    render();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') done(true);
    if (e.key === 'Escape') done(false);
  };
  input.onblur = () => done(true);
}

connect();
canvas.focus();
</script>
</body>
</html>
